name: List Directory

# 设置触发条件：当向任意分支推送代码时触发
on: [push]

jobs:
  run-command:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码库（可选，但如果后续要操作文件通常需要）
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 执行你的命令
      - name: Run ls command
        run: pwd && ls -l plan/ && ls -l /home/runner/work/AI_actions_test/AI_actions_test/plan
